<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Web</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f4f8;
    }
    .contenedor {
      display: flex;
      gap: 40px;
    }
    .globo {
      background-color: white;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      padding: 30px 40px;
      text-align: center;
      min-width: 150px;
    }
    .globo label {
      display: block;
      font-size: 14px;
      color: #888;
      margin-bottom: 10px;
    }
    .globo span {
      font-size: 28px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <div class="globo">
      <label>Campo 1 (F4)</label>
      <span id="campo1">...</span>
    </div>
    <div class="globo">
      <label>Campo 2 (C9)</label>
      <span id="campo2">...</span>
    </div>
  </div>
  <script>
    const URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRorubWj5Bh_a3PuFp2k2br8k_UsTIcMVVUJgX1IRR1e2e3vT9LeILU-fDyJEz0OAvcWixvksWimowI/pub?gid=0&single=true&output=csv';

    function actualizar() {
      fetch(URL_CSV + '&t=' + Date.now())
        .then(r => r.text())
        .then(data => {
          const filas = data.split('\n');
          const campo1 = filas[3].split(',')[5] || 'vacío';
          const campo2 = filas[8].split(',')[2] || 'vacío';

          const el1 = document.getElementById('campo1');
          const el2 = document.getElementById('campo2');
          if (el1.innerText !== campo1) el1.innerText = campo1;
          if (el2.innerText !== campo2) el2.innerText = campo2;
        })
        .catch(err => console.error('Error:', err));
    }

    actualizar();
    setInterval(actualizar, 10000);
  </script>
</body>
</html>
