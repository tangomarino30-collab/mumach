<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Web</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f4f8;
    }
    .contenedor {
      display: flex;
      gap: 40px;
    }
    .globo {
      background-color: white;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      padding: 30px 40px;
      text-align: center;
      min-width: 150px;
    }
    .globo label {
      display: block;
      font-size: 14px;
      color: #888;
      margin-bottom: 10px;
    }
    .globo span {
      font-size: 28px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <div class="globo">
      <label>Campo 1 (F4)</label>
      <span id="campo1">...</span>
    </div>
    <div class="globo">
      <label>Campo 2 (C9)</label>
      <span id="campo2">...</span>
    </div>
  </div>
  <script>
    const SHEET_ID = '1RFr9qIPlEOrYRbW0ESWBH_2PZfDuJg_WnsjD6Nc_C4c';

    function leerCelda(celda) {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&range=${celda}&v=${Date.now()}`;
      return fetch(url)
        .then(r => r.text())
        .then(text => {
          const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
          return json.table.rows[0]?.c[0]?.v ?? 'vacío';
        });
    }

    function actualizar() {
      leerCelda('F4').then(v => document.getElementById('campo1').innerText = v);
      leerCelda('C9').then(v => document.getElementById('campo2').innerText = v);
    }

    actualizar();
    setInterval(actualizar, 10000);
  </script>
</body>
</html>
