<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Web</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f4f8;
    }
    .contenedor {
      display: flex;
      gap: 40px;
    }
    .globo {
      background-color: white;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      padding: 30px 40px;
      text-align: center;
      min-width: 150px;
    }
    .globo label {
      display: block;
      font-size: 14px;
      color: #888;
      margin-bottom: 10px;
    }
    .globo span {
      font-size: 28px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <div class="globo">
      <label>Campo 1 (F4)</label>
      <span id="campo1">...</span>
    </div>
    <div class="globo">
      <label>Campo 2 (C9)</label>
      <span id="campo2">...</span>
    </div>
  </div>

  <!-- AQUÍ EMPIEZA EL NUEVO BLOQUE DEFINITIVO -->
  <script>
    // Tu ID extraído de la URL que me enviaste antes
    const SHEET_ID = '1vRorubWj5Bh_a3PuFp2k2br8k_UsTIcMVVUJgX1IRR1e2e3vT9LeILU-fDyJEz0OAvcWixvksWimowI';
    
    // Conectamos con el motor de datos en tiempo real de Google
    const URL_REALTIME = `https://google.com{SHEET_ID}/gviz/tq?tqx=out:json`;

    function actualizar() {
      fetch(URL_REALTIME + '&v=' + Date.now())
        .then(r => r.text())
        .then(text => {
          // Limpiamos el texto para convertirlo en un objeto JSON limpio
          const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
          const json = JSON.parse(jsonString);
          
          const filas = json.table.rows;

          // Buscamos F4 (Fila 4 es el índice 3. Columna F es la posición 5)
          const campo1 = filas[3]?.c[5]?.v || 'vacío';
          
          // Buscamos C9 (Fila 9 es el índice 8. Columna C es la posición 2)
          const campo2 = filas[8]?.c[2]?.v || 'vacío';

          const el1 = document.getElementById('campo1');
          const el2 = document.getElementById('campo2');

          if (el1.innerText !== String(campo1)) el1.innerText = campo1;
          if (el2.innerText !== String(campo2)) el2.innerText = campo2;
        })
        .catch(err => console.error('Error de conexión:', err));
    }

    // Se ejecuta de inmediato al cargar la página
    actualizar();
    
    // Se repite cada 10 segundos exactos sin problemas de caché
    setInterval(actualizar, 10000);
  </script>
  <!-- AQUÍ TERMINA EL NUEVO BLOQUE DEFINITIVO -->
</body>
</html>
